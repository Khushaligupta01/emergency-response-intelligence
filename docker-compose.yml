services:

  postgres:
    image: postgis/postgis:17-3.6
    container_name: emergency-response-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: emergency_response
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: CHANGE_ME
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: emergency-response-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
